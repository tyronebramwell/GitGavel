version: 1
scope:
  specs:
    include:
    - SPECIFICATION.md
    - README.md
    - Dockerfile
    - action.yml
    - docs/**/*.md
    - specs/**/*.md
    - api/openapi.json
  source:
    include:
    - '**/*.cs'
    - '**/*.ts'
    - '**/*.py'
    exclude:
    - '**/bin/**'
    - '**/obj/**'
    - '**/*.Tests/**'
    - 'tests/**'
    - '**/.git/**'
  tests:
    include:
    - '**/*.Tests/**/*.cs'
    - 'tests/**/*.cs'
    - '**/*.spec.ts'
    - '**/*.test.ts'
    - 'tests/**/*.py'
    - 'e2e/**'
    exclude:
    - '**/bin/**'
    - '**/obj/**'
    - '**/.git/**'
subagents:
  apiKeyEnv: GEMINI_API_KEY
  specDrift:
    enabled: true
    provider: gemini
    model: gemini-2.5-flash
  security:
    sarifReports:
    - reports/semgrep.sarif
    enabled: true
    provider: gemini
    model: gemini-2.5-flash
  reliability:
    enabled: true
    provider: gemini
    model: gemini-3.1-pro-preview
  refactoring:
    enabled: true
    provider: gemini
    model: gemini-2.5-flash
  tests:
    enabled: true
    provider: gemini
    model: gemini-2.5-flash
    tiers:
    - unit
    - integration
    - e2e
  issueResolution:
    enabled: true
    provider: gemini
    model: gemini-2.5-flash
    autoCloseCompleted: true
    commitLookbackCount: 50
    includeCommitLinks: true
triage:
  engine: jev
  subagentGating:
    enabled: true
    minConfidence: 0.5
    alwaysRunSecurityOnSarifAlerts: true
    alwaysRunSpecDriftOnSpecChanges: true
    bypassInFullRepoMode: false
  jev:
    apiKeyEnv: JEV_API_KEY
    thresholds:
      autoBacklogConfidence: 0.85
      humanReviewConfidence: 0.5
      autoCloseIssueConfidence: 0.90
    dedupeWithNoul: true
  maxIssuesPerRun: 4
reporting:
  outputDir: ./reports
  githubStepSummary: true
  formats:
  - markdown
  - json
  reports:
    auditRun: true
    tickets: true
    security: true
    codeQuality: true
    testQuality: true
github:
  labels:
  - ai-backlog
  pullRequests:
    enabled: true
    onlyChangedFiles: true
    auditExistingReviews: true
    postInlineComments: true
    postSummaryComment: true
    maxInlineCommentsPerPr: 10
    defaultReviewEvent: COMMENT
  issueClosure:
    enabled: true
    stateReason: completed
  projectsV2:
    enabled: true
    projectNumber: 2
    columns:
      backlog: Backlog
      humanReview: AI Triage
      done: Done
      discard: Discarded
    fields:
      priority: Priority
