version: 1

# Scope of files to audit
scope:
  specs:
    include: ["docs/**/*.md", "specs/**/*.md", "api/openapi.json", "SPECIFICATION.md", "Dockerfile", "action.yml"]
  source:
    include: ["**/*.cs", "**/*.ts", "**/*.py"]
    exclude: ["**/bin/**", "**/obj/**", "**/*.Tests/**", "tests/**", "**/.git/**"]
  tests:
    include: ["**/*.Tests/**/*.cs", "tests/**/*.cs", "**/*.spec.ts", "**/*.test.ts", "tests/**/*.py", "e2e/**"]
    exclude: ["**/bin/**", "**/obj/**", "**/.git/**"]

# System 2 Subagents (Generative LLMs)
subagents:
  apiKeyEnv: "AI_API_KEY" # Env var holding your LLM key (e.g. AI_API_KEY or GEMINI_API_KEY)
  # apiKey: "your-api-key-here" # Or set directly for local dev (omit in git repos)
  timeoutSeconds: 300     # Global LLM timeout in seconds (default: 300s / 5 mins)
  specDrift:
    enabled: true
    provider: "gemini"
    model: "gemini-2.5-pro"
  security:
    enabled: true
    provider: "gemini"
    model: "gemini-2.5-pro"
    sarifReports: ["reports/semgrep.sarif"]
  reliability:
    enabled: true                     # Phase 8: Reliability & Performance Subagent
    provider: "gemini"
    model: "gemini-2.5-pro"
  refactoring:
    enabled: true
    provider: "gemini"
    model: "gemini-2.5-flash"
  tests:
    enabled: true
    provider: "gemini"
    model: "gemini-2.5-pro"
    tiers: ["unit", "integration", "e2e"]
  issueResolution:
    enabled: true
    provider: "gemini"
    model: "gemini-2.5-flash"
    autoCloseCompleted: true
    commitLookbackCount: 50
    includeCommitLinks: true

# System 1 Triage Gatekeeper (Jev Decision Engine)
triage:
  engine: "jev" # options: "jev" | "llm-synthesizer"
  jev:
    apiKeyEnv: "JEV_API_KEY"
    thresholds:
      autoBacklogConfidence: 0.85     # > 0.85 -> Backlog
      humanReviewConfidence: 0.50     # 0.50 - 0.85 -> AI Triage
      autoCloseIssueConfidence: 0.90  # >= 0.90 -> Verify fix, post commit summary & close issue
    dedupeWithNoul: true
  maxIssuesPerRun: 4                  # Safety cap per audit run

# Developer Reporting Engine
reporting:
  outputDir: "./reports"
  githubStepSummary: true             # Writes overview directly to GitHub Actions UI
  formats: ["markdown", "json"]
  reports:
    auditRun: true
    tickets: true
    security: true
    codeQuality: true
    testQuality: true

# GitHub Projects (v2), Issues & PR Integration
github:
  labels:
    - "ai-backlog"
  pullRequests:
    enabled: true
    onlyChangedFiles: true            # Scope subagents strictly to files & diffs changed in the PR
    auditExistingReviews: true        # Deduplicate against existing PR review threads & comments
    postSummaryComment: true          # Post consolidated PR review summary comment (avoids inline diff clutter)
    defaultReviewEvent: "COMMENT"     # options: "COMMENT" | "REQUEST_CHANGES" | "APPROVE"
  issueClosure:
    enabled: true
    stateReason: "completed"
  projectsV2:
    enabled: true
    projectNumber: 2
    columns:
      backlog: "Backlog"
      humanReview: "AI Triage"
      done: "Done"
      discard: "Discarded"
    fields:
      priority: "Priority" # Maps Jev Score (1-5) to Project Priority
