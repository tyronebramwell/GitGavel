name: "GitGavel AI Repo & PR Audit"

on:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (preview only, no GitHub writes)"
        required: false
        type: boolean
        default: false
      mock:
        description: "Run in offline mock mode (no API keys required)"
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: read
  repository-projects: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitGavel Auditor
        uses: ./
        with:
          config_path: .gitgavel.yml
          dry_run: ${{ inputs.dry_run || false }}
          mock: ${{ inputs.mock || false }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.AI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}

      - name: Upload Audit Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitgavel-audit-reports
          path: ./reports/
          retention-days: 30
