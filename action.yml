name: "GitGavel AI Repo Auditor"
description: "Multi-Agent AI Repo Auditor & Backlog Sentinel powered by hybrid System 1 (Jev) + System 2 (Generative LLMs)."
author: "Tyrone Bramwell"
branding:
  icon: "check-circle"
  color: "blue"

# Note: GitHub Actions automatically exposes all defined inputs below as INPUT_<UPPER_NAME>
# environment variables inside the container (e.g., INPUT_REPOSITORY, INPUT_PR_NUMBER,
# INPUT_DRY_RUN, INPUT_MOCK, INPUT_MOCK_LLM, INPUT_ALLOW_EXTERNAL_PATHS, INPUT_ALL_AGENTS),
# which `gitgavel audit` reads directly in addition to the explicit CLI args below.
inputs:
  config_path:
    description: "Path to .gitgavel.yml configuration file"
    required: false
    default: ".gitgavel.yml"
  repo_directory:
    description: "Path to repository root directory to audit"
    required: false
    default: "."
  repository:
    description: "GitHub repository coordinates ('owner/repo')"
    required: false
    default: ""
  pr_number:
    description: "Optional Pull Request number to audit for PR reviews and inline comments"
    required: false
    default: ""
  dry_run:
    description: "Perform audit without modifying GitHub issues or projects"
    required: false
    default: "false"
  mock:
    description: "Run in offline mock mode"
    required: false
    default: "false"
  mock_llm:
    description: "Use simulated mock LLM subagents while preserving live TypeSafe Jev triage"
    required: false
    default: "false"
  allow_external_paths:
    description: "Explicitly allow configuration, SARIF, or reporting paths outside the repository root"
    required: false
    default: "false"
  all_agents:
    description: "Bypass Jev pre-execution subagent gating and execute all enabled subagents"
    required: false
    default: "false"

runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - "audit"
    - "--config"
    - "${{ inputs.config_path }}"
    - "--dir"
    - "${{ inputs.repo_directory }}"
